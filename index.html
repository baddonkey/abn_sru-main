<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neu im Bestand</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>Neueingänge</h1>
      </section>

      <section class="widget-shell" aria-label="Neueste Zugänge">
        <header class="widget-header">
          <div class="filter-bar" aria-label="Neueingänge filtern">
            <label class="filter-control" for="library-filter">
              <span>Bibliothek</span>
              <select id="library-filter" disabled>
                <option value="">Alle Bibliotheken (ABN)</option>
              </select>
            </label>

            <div class="filter-control month-filter-control">
              <div class="filter-control-heading">
                <label for="month-filter">Zeitraum</label>
                <output id="month-filter-value" for="month-filter">Aktueller Monat</output>
              </div>
              <input
                id="month-filter"
                type="range"
                min="1"
                max="12"
                step="1"
                value="1"
                list="month-filter-marks"
                disabled
              />
              <datalist id="month-filter-marks">
                <option value="1"></option>
                <option value="2"></option>
                <option value="3"></option>
                <option value="4"></option>
                <option value="5"></option>
                <option value="6"></option>
                <option value="7"></option>
                <option value="8"></option>
                <option value="9"></option>
                <option value="10"></option>
                <option value="11"></option>
                <option value="12"></option>
              </datalist>
              <div class="timeline-labels" aria-hidden="true">
                <span>Jetzt</span>
                <span>12 Monate</span>
              </div>
            </div>
          </div>

          <div class="widget-actions">
            <button id="refresh-button" class="ghost-button" type="button" disabled>
              Aktualisieren
            </button>
          </div>
        </header>

        <div id="status" class="status" role="status" aria-live="polite">
          Lade aktuelle Katalogdaten...
        </div>
        <ul id="book-list" class="book-list" aria-label="Neueste Zugänge"></ul>
      </section>
    </main>

    <script id="library-data" type="application/json">
      [
        { "scope": "ABN_AKB", "short": "AKB", "name": "Aargauer Kantonsbibliothek" },
        { "scope": "ABN_AKS", "short": "AKS", "name": "Alte Kantonsschule Aarau" },
        { "scope": "ABN_BZZ", "short": "BZZ", "filterShort": "BZZ", "name": "Bildungszentrum Zofingen" },
        { "scope": "ABN_DPA", "short": "DPA", "name": "Denkmalpflege Aargau" },
        { "scope": "ABN_BVU", "short": "BVU", "name": "Dept. Bau, Verkehr und Umwelt" },
        { "scope": "ABN_OGB", "short": "OGB", "name": "Gerichtsbibliothek Kanton Aargau" },
        { "scope": "ABN_HFGS", "short": "HFGS", "name": "HFGS Aarau" },
        { "scope": "ABN_HMA", "short": "HMA", "name": "Historisches Museum Aargau" },
        { "scope": "ABN_KSBB", "short": "KSBB", "name": "Kantonale Schule Berufsbildung" },
        { "scope": "ABN_KAB", "short": "KAB", "name": "Kantonsarchaeologie Brugg" },
        { "scope": "ABN_KSBA", "short": "KSBA", "name": "Kantonsschule Baden" },
        { "scope": "ABN_KSST", "short": "KSST", "name": "Kantonsschule Stein" },
        { "scope": "ABN_KSWE", "short": "KSWE", "name": "Kantonsschule Wettingen" },
        { "scope": "ABN_KSWO", "short": "KSWO", "name": "Kantonsschule Wohlen" },
        { "scope": "ABN_KURA", "short": "KURA", "name": "Aargauer Kuratorium Aarau" },
        { "scope": "ABN_NATURAMA", "short": "NATURAMA", "name": "Naturama" },
        { "scope": "ABN_NKS", "short": "NKS", "name": "Neue Kantonsschule Aarau" },
        { "scope": "ABN_RDRR", "short": "RDRR", "name": "Rechtsdienst des Regierungsrats" },
        { "scope": "ABN_STA", "short": "STA", "name": "Staatsarchiv des Kantons Aargau" },
        { "scope": "ABN_SVWGB", "short": "SVWGB", "name": "Spezialverwaltungsgerichtsbibliothek" }
      ]
    </script>
    <script src="./js/config.js"></script>
    <script src="./js/sru-widget.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
